name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Add macos-latest once the Darwin port builds end-to-end.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --locked

      - name: conformance
        if: runner.os == 'Linux'
        run: make conformance

      # The overlay bypassed, so the passthrough path it normally shields is
      # exercised directly.
      - name: conformance (unsafe)
        if: runner.os == 'Linux'
        run: make conformance-unsafe

      # The same suite against the other execution backend, which runs the
      # guest natively behind syscall user dispatch. Needs Linux 5.11+.
      - name: conformance (syscall user dispatch)
        if: runner.os == 'Linux'
        run: make conformance-sud
