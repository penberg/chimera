name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Add macos-latest once the Darwin port builds end-to-end.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --locked

      - name: conformance
        if: runner.os == 'Linux'
        # Name the backends rather than let the Makefile probe for them: a
        # regression that breaks syscall user dispatch also fails the probe,
        # which would quietly drop the backend instead of failing the job.
        run: make conformance BACKENDS="dbt sud"

      - name: conformance (sud, rewritten system calls)
        if: runner.os == 'Linux'
        # Syscall user dispatch rewrites trapped `syscall` instructions only
        # where Chimera can map address 0, which the stock mmap_min_addr
        # forbids, so the step above covers the signal path alone. A
        # container (`make ci`) cannot lower it and reruns that path.
        run: |
          sudo sysctl -w vm.mmap_min_addr=0 || true
          cargo test -p chimera-runtime --test sud-rewrite --locked
          make conformance BACKENDS=sud
