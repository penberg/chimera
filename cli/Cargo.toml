[package]
name = "chimera-cli"
version = "0.0.1"
edition = "2024"
description = "Command-line front end for the Chimera sandbox."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/penberg/chimera"
homepage = "https://github.com/penberg/chimera"

[[bin]]
name = "chimera"
path = "main.rs"

[dependencies]
chimera-runtime = { path = "../runtime" }
argh = "0.1.19"
libc = "0.2"
mimalloc = "0.1.52"

# Used only by the vendored fuser module (cli/fuser).
log = "0.4"
smallvec = "1.6"
zerocopy = { version = "0.8", features = ["derive"] }
